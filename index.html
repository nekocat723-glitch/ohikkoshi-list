    // アプリの状態
    let state = {
      data: JSON.parse(JSON.stringify(defaultData)),
      activeGenre: "すべて",
      roomId: roomId
    };

    // --- 初期化 ---
    document.addEventListener('DOMContentLoaded', () => {
      checkAuthStatus();
      loadLocalData();
      document.getElementById('roomDisplay').textContent = state.roomId;
    });

    // --- 認証・ロック機能 ---
    function checkAuthStatus() {
      const isAuth = localStorage.getItem(AUTH_KEY);
      const lockOverlay = document.getElementById('lockOverlay');
      const appContainer = document.getElementById('appContainer');

      if (isAuth === "true") {
        lockOverlay.classList.add('hidden');
        appContainer.classList.remove('hidden');
        renderAll();
      } else {
        lockOverlay.classList.remove('hidden');
        appContainer.classList.add('hidden');
      }
    }

    function handleUnlock(e) {
      e.preventDefault();
      const input = document.getElementById('passInput').value;
      const errorMsg = document.getElementById('lockError');

      if (input === PASSCODE) {
        localStorage.setItem(AUTH_KEY, "true");
        errorMsg.classList.add('hidden');
        checkAuthStatus();
        showToast("ロックを解除しました");
      } else {
        errorMsg.classList.remove('hidden');
      }
    }

    function lockApp() {
      localStorage.removeItem(AUTH_KEY);
      checkAuthStatus();
      document.getElementById('passInput').value = "";
      showToast("ロックしました");
    }

    // --- データ保存 & 読み込み ---
    function loadLocalData() {
      const saved = localStorage.getItem(STORAGE_KEY + "_" + state.roomId);
      if (saved) {
        try {
          state.data = JSON.parse(saved);
        } catch(e) {
          console.error("Local load failed", e);
        }
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY + "_" + state.roomId, JSON.stringify(state.data));
      renderDashboard();
    }

    // --- レンダリング系 ---
    function renderAll() {
      renderGenreTabs();
      renderSelectOptions();
      renderItems();
      renderDashboard();
      renderSchedules();
      document.getElementById('memoText').value = state.data.memo || "";
    }

    // ダッシュボード
    function renderDashboard() {
      const items = state.data.items;
      const total = items.length;
      const checked = items.filter(i => i.checked).length;
      const percent = total > 0 ? Math.round((checked / total) * 100) : 0;

      document.getElementById('progressPercent').textContent = `${percent}%`;
      document.getElementById('progressRatio').textContent = `${checked} / ${total} 完了`;
      document.getElementById('progressBar').style.width = `${percent}%`;

      const totalCost = items.reduce((sum, i) => sum + (Number(i.price) || 0), 0);
      const purchasedCost = items.filter(i => i.checked).reduce((sum, i) => sum + (Number(i.price) || 0), 0);

      document.getElementById('totalCost').textContent = `¥${totalCost.toLocaleString()}`;
      document.getElementById('purchasedCost').textContent = `¥${purchasedCost.toLocaleString()}`;
    }

    // スケジュール
    function renderSchedules() {
      const container = document.getElementById('scheduleList');
      container.innerHTML = "";

      state.data.schedules.forEach((sch) => {
        const div = document.createElement('div');
        div.className = "flex items-center justify-between bg-white/90 px-3 py-2 rounded-xl border border-amber-200/70 text-xs";
        div.innerHTML = `
          <label class="flex items-center space-x-2 flex-1 cursor-pointer mr-2">
            <input type="checkbox" ${sch.done ? 'checked' : ''} onchange="toggleSchedule('${sch.id}')" 
              class="w-4 h-4 text-amber-500 rounded focus:ring-amber-400">
            <span class="${sch.done ? 'line-through text-slate-400' : 'text-amber-950 font-medium'}">${escapeHtml(sch.text)}</span>
          </label>
          <button onclick="deleteSchedule('${sch.id}')" class="text-slate-300 hover:text-rose-500 font-bold px-1">&times;</button>
        `;
        container.appendChild(div);
      });
    }

    function toggleSchedule(id) {
      const sch = state.data.schedules.find(s => s.id === id);
      if (sch) {
        sch.done = !sch.done;
        saveData();
        renderSchedules();
      }
    }

    function addSchedule() {
      const text = prompt("新しい予定を入力してください:");
      if (text && text.trim()) {
        state.data.schedules.push({
          id: 's_' + Date.now(),
          text: text.trim(),
          done: false
        });
        saveData();
        renderSchedules();
      }
    }

    function deleteSchedule(id) {
      state.data.schedules = state.data.schedules.filter(s => s.id !== id);
      saveData();
      renderSchedules();
    }

    function saveMemo(text) {
      state.data.memo = text;
      saveData();
    }

    // ジャンルタブ
    function renderGenreTabs() {
      const container = document.getElementById('genreTabs');
      container.innerHTML = "";

      const genres = ["すべて", ...state.data.genres];
      genres.forEach(g => {
        const btn = document.createElement('button');
        const isActive = state.activeGenre === g;
        btn.className = `px-3 py-1.5 rounded-lg whitespace-nowrap transition ${
          isActive 
            ? 'bg-rose-500 text-white font-bold shadow-sm' 
            : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
        }`;
        btn.textContent = g;
        btn.onclick = () => {
          state.activeGenre = g;
          renderGenreTabs();
          renderItems();
        };
        container.appendChild(btn);
      });
    }

    // セレクトボックスの選択肢更新
    function renderSelectOptions() {
      const genreSelect = document.getElementById('newItemGenre');
      const locationSelect = document.getElementById('newItemLocation');

      genreSelect.innerHTML = state.data.genres.map(g => `<option value="${g}">${g}</option>`).join('');
      locationSelect.innerHTML = state.data.locations.map(l => `<option value="${l}">${l}</option>`).join('');
    }

    // リスト描画
    function renderItems() {
      const container = document.getElementById('itemList');
      container.innerHTML = "";

      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      let filtered = state.data.items.filter(item => {
        // ジャンルフィルター
        if (state.activeGenre !== "すべて" && item.genre !== state.activeGenre) return false;
        // 完了状態フィルター
        if (status === "checked" && !item.checked) return false;
        if (status === "unchecked" && item.checked) return false;
        // 検索フィルター
        if (search) {
          const matchTitle = item.title.toLowerCase().includes(search);
          const matchNote = (item.note || "").toLowerCase().includes(search);
          const matchShop = (item.shop || "").toLowerCase().includes(search);
          if (!matchTitle && !matchNote && !matchShop) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300">
            <p class="text-slate-400 text-sm">該当するアイテムが見つかりません</p>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `bg-white p-3.5 sm:p-4 rounded-2xl border transition shadow-sm ${
          item.checked ? 'border-slate-200 bg-slate-50/60 opacity-80' : 'border-slate-200 hover:border-slate-300'
        }`;

        const locationOptions = state.data.locations.map(l => 
          `<option value="${l}" ${item.location === l ? 'selected' : ''}>${l}</option>`
        ).join('');

        const genreOptions = state.data.genres.map(g => 
          `<option value="${g}" ${item.genre === g ? 'selected' : ''}>${g}</option>`
        ).join('');

        card.innerHTML = `
          <div class="flex items-start space-x-3">
            <!-- チェックボックス -->
            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItemCheck('${item.id}')"
              class="mt-1 w-5 h-5 text-rose-500 rounded focus:ring-rose-400 cursor-pointer">

            <div class="flex-1 min-w-0 space-y-2">
              
              <!-- タイトル & 基本属性 -->
              <div class="flex flex-wrap items-center gap-2">
                <input type="text" value="${escapeHtml(item.title)}" onchange="updateItemField('${item.id}', 'title', this.value)"
                  class="font-semibold text-sm sm:text-base text-slate-800 bg-transparent focus:bg-white focus:outline-none focus:ring-1 focus:ring-rose-400 rounded px-1 -ml-1 flex-1 min-w-[150px] ${
                    item.checked ? 'line-through text-slate-400' : ''
                  }">

                <!-- バッジ（ジャンル & 保管場所） -->
                <div class="flex items-center space-x-1 text-xs">
                  <select onchange="updateItemField('${item.id}', 'genre', this.value)" 
                    class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-2 py-0.5 rounded-md border-0 focus:ring-1 focus:ring-rose-400">
                    ${genreOptions}
                  </select>

                  <select onchange="updateItemField('${item.id}', 'location', this.value)"
                    class="bg-rose-50 hover:bg-rose-100 text-rose-700 font-medium px-2 py-0.5 rounded-md border-0 focus:ring-1 focus:ring-rose-400">
                    ${locationOptions}
                  </select>
                </div>
              </div>

              <!-- 詳細属性（購入場所・価格・メモ） -->
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs text-slate-500 pt-1">
                <div class="flex items-center space-x-1">
                  <span class="text-slate-400">店:</span>
                  <input type="text" value="${escapeHtml(item.shop || '')}" placeholder="購入店・サイト" onchange="updateItemField('${item.id}', 'shop', this.value)"
                    class="w-full bg-slate-50 focus:bg-white px-2 py-1 border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-rose-400">
                </div>

                <div class="flex items-center space-x-1">
                  <span class="text-slate-400">¥:</span>
                  <input type="number" value="${item.price || ''}" placeholder="金額" onchange="updateItemField('${item.id}', 'price', Number(this.value))"
                    class="w-full bg-slate-50 focus:bg-white px-2 py-1 border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-rose-400">
                </div>

                <div class="flex items-center space-x-1">
                  <span class="text-slate-400">メモ:</span>
                  <input type="text" value="${escapeHtml(item.note || '')}" placeholder="サイズ・補足" onchange="updateItemField('${item.id}', 'note', this.value)"
                    class="w-full bg-slate-50 focus:bg-white px-2 py-1 border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-rose-400">
                </div>
              </div>

            </div>

            <!-- 削除ボタン -->
            <button onclick="deleteItem('${item.id}')" class="text-slate-300 hover:text-rose-500 p-1 font-bold text-lg">
              &times;
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- アイテム操作 ---
    function toggleItemCheck(id) {
      const item = state.data.items.find(i => i.id === id);
      if (item) {
        item.checked = !item.checked;
        saveData();
        renderItems();
      }
    }

    function updateItemField(id, field, value) {
      const item = state.data.items.find(i => i.id === id);
      if (item) {
        item[field] = value;
        saveData();
        if (field === 'price') renderDashboard();
      }
    }

    function handleAddItem(e) {
      e.preventDefault();
      const titleInput = document.getElementById('newItemTitle');
      const genreSelect = document.getElementById('newItemGenre');
      const locationSelect = document.getElementById('newItemLocation');

      const title = titleInput.value.trim();
      if (!title) return;

      const newItem = {
        id: 'item_' + Date.now(),
        title: title,
        genre: genreSelect.value,
        location: locationSelect.value,
        checked: false,
        price: 0,
        note: '',
        shop: ''
      };

      state.data.items.unshift(newItem);
      saveData();
      renderAll();
      titleInput.value = "";
      showToast("アイテムを追加しました");
    }

    function deleteItem(id) {
      if (confirm("このアイテムを削除しますか？")) {
        state.data.items = state.data.items.filter(i => i.id !== id);
        saveData();
        renderAll();
        showToast("削除しました");
      }
    }

    // --- ジャンル・保管場所モーダル管理 ---
    function openManageModal() {
      renderManageLists();
      document.getElementById('manageModal').classList.remove('hidden');
    }

    function closeManageModal() {
      document.getElementById('manageModal').classList.add('hidden');
      renderAll();
    }

    function renderManageLists() {
      // ジャンル
      const gContainer = document.getElementById('genreManageList');
      gContainer.innerHTML = state.data.genres.map(g => `
        <div class="flex items-center justify-between bg-slate-50 px-3 py-1.5 rounded-lg text-xs">
          <input type="text" value="${escapeHtml(g)}" onchange="renameGenre('${escapeHtml(g)}', this.value)" class="bg-transparent font-medium border-b border-transparent focus:border-rose-400 focus:outline-none">
          <button onclick="removeGenre('${escapeHtml(g)}')" class="text-slate-400 hover:text-rose-500 font-bold">&times;</button>
        </div>
      `).join('');

      // 保管場所
      const lContainer = document.getElementById('locationManageList');
      lContainer.innerHTML = state.data.locations.map(l => `
        <div class="flex items-center justify-between bg-slate-50 px-3 py-1.5 rounded-lg text-xs">
          <input type="text" value="${escapeHtml(l)}" onchange="renameLocation('${escapeHtml(l)}', this.value)" class="bg-transparent font-medium border-b border-transparent focus:border-rose-400 focus:outline-none">
          <button onclick="removeLocation('${escapeHtml(l)}')" class="text-slate-400 hover:text-rose-500 font-bold">&times;</button>
        </div>
      `).join('');
    }

    function handleAddGenre(e) {
      e.preventDefault();
      const input = document.getElementById('newGenreInput');
      const val = input.value.trim();
      if (val && !state.data.genres.includes(val)) {
        state.data.genres.push(val);
        saveData();
        renderManageLists();
        input.value = "";
      }
    }

    function renameGenre(oldName, newName) {
      newName = newName.trim();
      if (!newName || oldName === newName) return;
      const index = state.data.genres.indexOf(oldName);
      if (index !== -1) {
        state.data.genres[index] = newName;
        // 既存アイテムも置き換え
        state.data.items.forEach(i => { if (i.genre === oldName) i.genre = newName; });
        saveData();
        renderManageLists();
      }
    }

    function removeGenre(g) {
      if (state.data.genres.length <= 1) return alert("最低1つのジャンルが必要です");
      state.data.genres = state.data.genres.filter(x => x !== g);
      saveData();
      renderManageLists();
    }

    function handleAddLocation(e) {
      e.preventDefault();
      const input = document.getElementById('newLocationInput');
      const val = input.value.trim();
      if (val && !state.data.locations.includes(val)) {
        state.data.locations.push(val);
        saveData();
        renderManageLists();
        input.value = "";
      }
    }

    function renameLocation(oldName, newName) {
      newName = newName.trim();
      if (!newName || oldName === newName) return;
      const index = state.data.locations.indexOf(oldName);
      if (index !== -1) {
        state.data.locations[index] = newName;
        state.data.items.forEach(i => { if (i.location === oldName) i.location = newName; });
        saveData();
        renderManageLists();
      }
    }

    function removeLocation(l) {
      if (state.data.locations.length <= 1) return alert("最低1つの保管場所が必要です");
      state.data.locations = state.data.locations.filter(x => x !== l);
      saveData();
      renderManageLists();
    }

    // --- 【重要修正】共有URLの組み立て ---
    function copyShareLink() {
      // ドメイン重複を防ぎ、常に正しく原点のURL＋?room=xxx を生成
      const cleanUrl = window.location.origin + window.location.pathname + '?room=' + encodeURIComponent(state.roomId);
      
      // クリップボードへコピー
      const tempInput = document.createElement('input');
      tempInput.value = cleanUrl;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);

      showToast("共有URLをコピーしました！");
    }

    // --- ユーティリティ ---
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }
  </script>
